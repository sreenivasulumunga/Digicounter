<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Subscription Approvals</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  window.FIREBASE_CONFIG = {
    apiKey: "AIzaSyCamjSFod5ocv24QHAjt4cyWNIwFkXf_5I",
    authDomain: "digicounter-3577c.firebaseapp.com",
    projectId: "digicounter-3577c",
    storageBucket: "digicounter-3577c.firebasestorage.app",
    messagingSenderId: "185412218372",
    appId: "1:185412218372:web:428d0ea8083ec558f00f51",
    measurementId: "G-HC56Z988LG"
  };
  window.ADMIN_EMAIL = "sreenivasulumunga@gmail.com";
</script>
<style>
  :root{ --ink:#12181b; --paper:#f6f4ee; --line:#d8d3c4; --accent:#c1531f; --good:#1f6f5c; --warn:#b3492e; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; padding:20px 16px 60px; }
  h1{ font-size:20px; margin:0 0 4px; font-weight:800; }
  .sub{ font-size:13px; color:#5b6663; margin:0 0 18px; }
  .btn{ appearance:none; border:none; border-radius:10px; padding:11px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-good{ background:var(--good); color:#fff; }
  .btn-warn{ background:var(--warn); color:#fff; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .google-btn{ display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #dadce0; border-radius:10px; padding:11px 22px; font-size:15px; font-weight:600; cursor:pointer; }
  .center{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; text-align:center; }
  .card{ border:1px solid var(--line); border-radius:12px; background:#fff; padding:16px; margin-bottom:12px; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .name{ font-weight:800; font-size:15px; }
  .meta{ font-size:13px; color:#5b6663; margin-top:4px; }
  .empty{ text-align:center; padding:40px 20px; color:#8a8272; }
  .hidden{ display:none !important; }
  .tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn{ appearance:none; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:9px 16px; font-size:13.5px; font-weight:700; cursor:pointer; }
  .tab-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .utr-tag{ font-family:'SFMono-Regular',Consolas,monospace; font-size:12px; background:#f0ece0; padding:2px 6px; border-radius:5px; }
  .device-badge{ display:inline-block; font-size:11.5px; padding:2px 8px; border-radius:20px; background:#f0ece0; color:#5b5548; margin-top:4px; }
  .device-badge.warn{ background:#fdeae2; color:var(--warn); font-weight:700; }
</style>
</head>
<body>

<div class="center" id="signInScreen">
  <h1>🔐 Admin — Subscription Approvals</h1>
  <p class="sub">Sign in with your admin Google account.</p>
  <button class="google-btn" id="signInBtn">Sign in with Google</button>
</div>

<div class="hidden" id="deniedScreen">
  <div class="center">
    <h1>Access denied</h1>
    <p class="sub">This account isn't authorized to view the admin page.</p>
    <button class="btn btn-ghost" id="signOutBtn2">Sign out</button>
  </div>
</div>

<div class="hidden" id="adminScreen">
  <h1>🔐 Subscription Admin</h1>
  <div class="tabs">
    <button class="tab-btn active" id="tabPendingBtn">Pending</button>
    <button class="tab-btn" id="tabActiveBtn">Active Subscriptions</button>
  </div>
  <p class="sub" id="pendingCountText">Loading…</p>
  <div id="requestsList"></div>
  <button class="btn btn-ghost" id="signOutBtn" style="margin-top:16px;">Sign out</button>
</div>

<script>
(function(){
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const $ = id => document.getElementById(id);
  let unsub = null;
  let currentTab = 'pending';

  $('signInBtn').addEventListener('click', () => {
    auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
  });
  auth.getRedirectResult().catch(err => {
    if (err && err.code) alert('Sign-in failed: ' + err.message);
  });
  $('signOutBtn').addEventListener('click', () => auth.signOut());
  $('signOutBtn2').addEventListener('click', () => auth.signOut());
  $('tabPendingBtn').addEventListener('click', () => switchTab('pending'));
  $('tabActiveBtn').addEventListener('click', () => switchTab('active'));

  function switchTab(tab){
    currentTab = tab;
    $('tabPendingBtn').classList.toggle('active', tab === 'pending');
    $('tabActiveBtn').classList.toggle('active', tab === 'active');
    subscribeToTab();
  }

  function show(id){
    ['signInScreen','deniedScreen','adminScreen'].forEach(x => $(x).classList.toggle('hidden', x !== id));
  }

  auth.onAuthStateChanged(user => {
    if (unsub){ unsub(); unsub = null; }
    if (!user){ show('signInScreen'); return; }
    if (user.email !== window.ADMIN_EMAIL){ show('deniedScreen'); return; }
    show('adminScreen');
    subscribeToTab();
  });

  function subscribeToTab(){
    if (unsub){ unsub(); unsub = null; }
    const status = currentTab === 'pending' ? 'pending' : 'active';
    unsub = db.collection('users').where('status', '==', status).onSnapshot(snap => {
      if (currentTab === 'pending') renderPendingList(snap.docs);
      else renderActiveList(snap.docs);
    }, err => {
      $('pendingCountText').textContent = 'Error loading: ' + err.message;
    });
  }

  function money(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function deviceCount(data){
    return data.devices ? Object.keys(data.devices).length : 0;
  }

  function renderPendingList(docs){
    const list = $('requestsList');
    $('pendingCountText').textContent = docs.length + ' pending request' + (docs.length===1?'':'s');
    list.innerHTML = '';
    if (docs.length === 0){
      list.innerHTML = '<div class="empty">No pending requests right now.</div>';
      return;
    }
    docs.forEach(d => {
      const data = d.data();
      const requestedAt = data.requestedAt && data.requestedAt.toDate ? data.requestedAt.toDate().toLocaleString() : '—';
      const devCount = deviceCount(data);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="row">
          <div>
            <div class="name">${escapeHtml(data.name || data.email || 'Unknown')}</div>
            <div class="meta">${escapeHtml(data.email||'')}</div>
            <div class="meta">Plan: <b>${escapeHtml(data.plan||'—')}</b> · Amount: <b>${money(data.amount)}</b></div>
            <div class="meta">Transaction ID: <span class="utr-tag">${escapeHtml(data.transactionId||'not provided')}</span></div>
            <div class="meta">Requested: ${requestedAt}</div>
            <span class="device-badge ${devCount>1?'warn':''}">${devCount} device${devCount===1?'':'s'} seen</span>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-good" data-action="approve">✅ Approve</button>
            <button class="btn btn-warn" data-action="reject">✕ Reject</button>
          </div>
        </div>
      `;
      card.querySelector('[data-action="approve"]').addEventListener('click', () => approve(d.id, data));
      card.querySelector('[data-action="reject"]').addEventListener('click', () => reject(d.id));
      list.appendChild(card);
    });
  }

  function renderActiveList(docs){
    const list = $('requestsList');
    $('pendingCountText').textContent = docs.length + ' active subscription' + (docs.length===1?'':'s');
    list.innerHTML = '';
    if (docs.length === 0){
      list.innerHTML = '<div class="empty">No active subscriptions right now.</div>';
      return;
    }
    docs.forEach(d => {
      const data = d.data();
      const expiry = data.expiryDate && data.expiryDate.toDate ? data.expiryDate.toDate() : null;
      const daysLeft = expiry ? Math.max(0, Math.ceil((expiry.getTime()-Date.now())/86400000)) : '—';
      const devCount = deviceCount(data);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="row">
          <div>
            <div class="name">${escapeHtml(data.name || data.email || 'Unknown')}</div>
            <div class="meta">${escapeHtml(data.email||'')}</div>
            <div class="meta">Plan: <b>${escapeHtml(data.plan||'—')}</b> · ${daysLeft} day${daysLeft===1?'':'s'} left</div>
            <span class="device-badge ${devCount>1?'warn':''}">${devCount} device${devCount===1?'':'s'} seen${devCount>1?' — check for sharing':''}</span>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-warn" data-action="revoke">Revoke</button>
          </div>
        </div>
      `;
      card.querySelector('[data-action="revoke"]').addEventListener('click', () => revoke(d.id));
      list.appendChild(card);
    });
  }

  function approve(uid, data){
    const days = data.planDays || 30;
    const expiry = new Date(Date.now() + days * 86400000);
    db.collection('users').doc(uid).set({
      status: 'active',
      expiryDate: firebase.firestore.Timestamp.fromDate(expiry),
      approvedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(err => alert('Failed: ' + err.message));
  }
  function reject(uid){
    if (!confirm('Reject this request? The user will need to submit a new payment request.')) return;
    db.collection('users').doc(uid).set({ status: 'none' }, { merge: true }).catch(err => alert('Failed: ' + err.message));
  }
  function revoke(uid){
    if (!confirm('Revoke this subscription immediately? The user will be sent back to the payment screen.')) return;
    db.collection('users').doc(uid).set({ status: 'none', expiryDate: null }, { merge: true }).catch(err => alert('Failed: ' + err.message));
  }
})();
</script>

</body>
</html>
